<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulated Corporate Web Application</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .login-form { background: #f5f5f5; padding: 20px; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { background: #007cba; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Corporate Web Portal</h1>
            <p>Simulated environment for incident response training</p>
        </div>
        
        <div class="login-form">
            <h2>Employee Login</h2>
            <form>
                <input type="text" placeholder="Username" />
                <input type="password" placeholder="Password" />
                <button type="submit">Sign In</button>
            </form>
        </div>
        
        <div style="margin-top: 40px;">
            <h3>System Status</h3>
            <p>🟢 Web Server: Online</p>
            <p>🟢 Database: Connected</p>
            <p>🟡 Security Monitor: Active</p>
        </div>
    </div>
</body>
</html>
